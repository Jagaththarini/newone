<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TikTok Clone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    .app {
      display: flex;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    .video-container {
      position: relative;
      width: 360px;
      max-width: 100%;
      height: 100%;
      background: #111;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sidebar {
      position: absolute;
      right: 10px;
      bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .icon {
      text-align: center;
      font-size: 22px;
      cursor: pointer;
    }

    .icon span {
      display: block;
      font-size: 12px;
      margin-top: 4px;
    }

    .info {
      position: absolute;
      bottom: 20px;
      left: 15px;
      max-width: 75%;
    }

    .username {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .caption {
      font-size: 14px;
      line-height: 1.3;
    }

    .top-bar {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="video-container">

    <div class="top-bar">Following | For You</div>

    <video autoplay loop muted>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      Your browser does not support video.
    </video>

    <div class="sidebar">
      <div class="icon">❤️<span>1.2K</span></div>
      <div class="icon">💬<span>320</span></div>
      <div class="icon">🔁<span>Share</span></div>
    </div>

    <div class="info">
      <div class="username">@username</div>
      <div class="caption">
        This is a TikTok-style video layout 👀🔥<br>
        #html #css #tiktokclone
      </div>
    </div>

  </div>
</div>

</body>
</html>
